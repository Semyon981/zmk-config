# Диагностика. Докладывается поверх остальных .conf по `make LOG=1 <цель>`,
# в обычной сборке не участвует.
#
# Сами логи в USB включает не этот файл, а snippet `zmk-usb-logging` (его
# добавляет Makefile): кроме Kconfig нужен ещё узел zephyr,cdc-acm-uart
# в девайстри, одними символами не обойтись.
#
# Здесь — только уровень логирования драйвера экрана. На DBG видно
# инициализацию SPI, номера перерисовываемых строк и ошибки семафора.
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# Логи самой LVGL. На уровне WARN сюда попадает `couldn't allocate memory`
# — прямое доказательство нехватки LV_Z_MEM_POOL_SIZE, если экран белеет.
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
