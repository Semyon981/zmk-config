# Включает экран. В ZMK дисплей выключен по умолчанию, без этой строки
# прошивка собирается вообще без кода для экрана.
#
# Экран по умолчанию — nice!view (Sharp memory LCD), см. SCREEN в Makefile.
# Штатный OLED собирается через `make SCREEN=oled`; настройки ниже под
# nice!view ему не мешают, потому что при SSD1306 шилд corne задаёт свои
# значения в Kconfig.defconfig, а эти строки перебивают только его.
CONFIG_ZMK_DISPLAY=y

# --- LVGL под nice!view ---
#
# Обязательно: у шилдов corne и nice_view конфликтуют Kconfig.defconfig.
# corne задаёт VDB 64% и DPI 148 (под свой OLED), nice_view — 100% и 161, а
# выигрывает первый в списке -DSHIELD, то есть corne. Порядок менять нельзя
# (corne_<side> обязан быть первым), поэтому значения задаются явно здесь.
#
# С VDB 64% кадр 160x68 уезжал в панель двумя кусками (строки 1-46 и 47-68):
# шов давал полосы и пустую нижнюю треть. Под DPI 148 разъезжалась вёрстка
# виджета. Это доказанный фикс, не трогать.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161

# Писать кадр целиком, а не изменившийся кусок.
CONFIG_LV_Z_FULL_REFRESH=y

# С запасом. Причиной проблем куча не была: логи LVGL на 8192/16384/32768
# не показали ни одной жалобы на память.
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Инверсию пикселя не включать: у этого клона полярность прямая, с
# CONFIG_NICE_VIEW_WIDGET_INVERTED=y экран пустой (белым по белому).

# --- Расход на экран ---
#
# Тик LVGL. Дефолт ZMK — 10 мс, то есть lv_task_handler дёргается 100 раз в
# секунду на обеих половинках. Экран обновляется событиями (батарея, WPM,
# слой), 100 Гц опроса ему не нужны; 100 мс хватает с запасом.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100

# Гашение по простою. На nice!view оно панель НЕ гасит: у неё нет
# disp-en-gpios, поэтому ls0xx_blanking_on() (zephyr/drivers/display/ls0xx.c)
# пишет в лог `Unsupported` и возвращает -ENOTSUP, а Sharp memory LCD держит
# последний кадр без питания. Смысл строки в другом: обработчик простоя
# (zmk/app/src/display/main.c) собран только при =y, и именно он делает
# k_timer_stop(&display_timer) — без него тик крутится вечно, даже когда
# клавиатура лежит без дела. Так что картинка остаётся, а пробуждения
# прекращаются через ZMK_IDLE_TIMEOUT (30 с по умолчанию) и возвращаются
# на первом же нажатии.
#
# Цена: пока клавиатура простаивает, кадр застывший — заряд и язык
# обновятся только после нажатия. И **для сборки SCREEN=oled это настоящее
# гашение**: там панель действительно потухнет по простою. Раньше стояло =n
# именно ради OLED, ценой выгорания пикселей статичным status screen; если
# OLED снова понадобится с постоянно горящим экраном — вернуть =n и
# смириться с вечным тиком.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Приём состояния Num/Caps/Scroll Lock от хоста. Нужен модулю ru-layer-sync:
# в ОС индикатор ScrollLock привязан к русской группе (xkb grp_led:scroll),
# по нему прошивка сама держит слой RU.
#
# Включается на обеих половинках, хотя работает только на центральной: сам
# обработчик отчёта (src/hid_indicators.c) в ZMK лежит внутри блока
# `if (central)`, а на периферии от опции остаётся только неиспользуемый
# event-тип — +36 байт флеша и никакой логики.
CONFIG_ZMK_HID_INDICATORS=y

# Виджет батареи с процентами вместо иконки — опция штатного status screen.
# На nice!view не действует: у шилда свой ZMK_DISPLAY_STATUS_SCREEN_CUSTOM.
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# --- Диагностика (выключено) ---
# Логи ZMK в USB-порт: при каждом нажатии печатает событие kscan
# с номерами строки и столбца. Раскомментировать, если снова
# понадобится ловить проблемы с матрицей. Постоянно держать не нужно.
# CONFIG_ZMK_USB_LOGGING=y
