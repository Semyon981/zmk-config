# Kconfig поверх corne.conf — только для раскладки parity.

# Слой RU объявлен вторым, а ZMK_RU_LAYER_SYNC_LAYER по умолчанию равен 1 —
# переопределять индекс не нужно, достаточно включить сам модуль.
CONFIG_ZMK_RU_LAYER_SYNC=y

# Свой status screen: крупный EN/RU вместо кружков BLE-профилей.
#
# Виджет шилда nice_view приходится выключить: zmk_display_status_screen()
# в ZMK объявлен weak, но сильное определение может быть только одно.
# Индекс слоя тот же, что у ru-layer-sync, — RU объявлен вторым.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_ZMK_LANG_SCREEN=y
