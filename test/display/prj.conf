# Минимум для картинки на nice!view: SPI, драйвер Sharp LS0XX, display API.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_LS0XX=y

# LVGL нет вообще — кадр собирается руками в буфере 160x68/8 = 1360 байт.
CONFIG_MAIN_STACK_SIZE=4096

# Логи в USB-порт: собирается со snippet cdc-acm-console (см. Makefile).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_INF=y
CONFIG_BOOT_BANNER=y

# Snippet cdc-acm-console сам USB не поднимает: без этого нет /dev/ttyACM*
# и плата вообще не появляется в lsusb.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="display test"
CONFIG_USB_DEVICE_MANUFACTURER="corne"

# sys_reboot(RST_UF2) для ухода в бутлоадер по команде с хоста (test/common/dfu.c).
CONFIG_REBOOT=y
