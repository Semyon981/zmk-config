# Включает OLED-экраны. В ZMK дисплей выключен по умолчанию,
# без этой строки прошивка собирается вообще без кода для экрана.
CONFIG_ZMK_DISPLAY=y

# --- Диагностика (выключено) ---
# Логи ZMK в USB-порт: при каждом нажатии печатает событие kscan
# с номерами строки и столбца. Раскомментировать, если снова
# понадобится ловить проблемы с матрицей. Постоянно держать не нужно.
# CONFIG_ZMK_USB_LOGGING=y
